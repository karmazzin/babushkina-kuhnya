name: Build Android test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - run: npm ci
      - run: npm run build && npm run check:release && npm test
      - run: npm run android:apk
      - run: python3 scripts/verify-android-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: babushkina-kuhnya-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
